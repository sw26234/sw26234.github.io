<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Wellbeing</title>

    <!-- 手机检测：尽早执行，避免页面闪现（平板和电脑不受影响） -->
    <script>
        (function () {
            var ua = navigator.userAgent || "";

            // 1. 明确的手机 UA（iPad 不匹配；Android 平板 UA 不含 "Mobile"）
            var isPhoneUA =
                /iPhone|iPod|Windows Phone|IEMobile|BlackBerry|Opera Mini|webOS/i.test(ua) ||
                (/Android/i.test(ua) && /Mobile/i.test(ua)) ||
                /HarmonyOS.*Mobile/i.test(ua);

            // 2. 屏幕尺寸兜底：触屏设备且短边小于 600px，视为手机
            //    （手机开"桌面版网站"模式时 UA 会变，但屏幕尺寸不变）
            var isTouch = (navigator.maxTouchPoints || 0) > 0;
            var shortSide = Math.min(screen.width, screen.height);
            var isSmallTouchScreen = isTouch && shortSide > 0 && shortSide < 600;

            if (isPhoneUA || isSmallTouchScreen) {
                document.documentElement.classList.add("is-phone");
            }
        })();
    </script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 手机拦截提示 -->
    <div id="mobileBlock" class="mobile-block" role="alert">
        <div class="mobile-block-card">
            <div class="mobile-block-icon">🖥️</div>
            <h2>Not Available on Phones</h2>
            <p>This website is not available on mobile phones.<br>Please visit it on a computer or tablet.</p>
            <p class="mobile-block-cn">本网站不支持手机访问，请使用电脑或平板打开。</p>
        </div>
    </div>

    <!-- BAD APPLE BACKGROUND VIDEO -->
    <video id="backgroundVideo" class="background-video" playsinline preload="none">
        <source src="./bad-apple.mp4" type="video/mp4">
    </video>

    <!-- HIDDEN PLAY BUTTON -->
    <button id="videoButton" class="video-button" aria-label="Play background video">
        ▶
    </button>

    <div class="page" id="home">
        <div class="side">
            <div class="logo">Digital Wellbeing</div>
            <div class="menu">
                <a href="#home" class="now">Home</a>
